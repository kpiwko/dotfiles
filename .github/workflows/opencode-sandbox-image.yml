name: opencode sandbox image

# Builds the OpenCode sandbox workload image (OpenShell community base + pinned
# OpenCode) and publishes it to GHCR for both architectures. Running in Actions
# is what makes the push possible at all: GHCR requires `write:packages`, which a
# developer's `gh` login for ordinary repository work does not carry.
#
# After a run, copy the printed manifest digest into
# `.config/k8s/openshell/opencode/create-sandbox.sh` (SANDBOX_IMAGE). The sandbox
# policy pins the binary path, so the workload must not drift under a floating tag.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .config/k8s/openshell/opencode/image/**
      - .github/workflows/opencode-sandbox-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: opencode-sandbox-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/opencode-sandbox
  OPENCODE_VERSION: 2.3.0

jobs:
  build-and-push:
    name: build and push (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (arm64 emulation for the amd64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch manifest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .config/k8s/openshell/opencode/image
          file: .config/k8s/openshell/opencode/image/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OPENCODE_VERSION=${{ env.OPENCODE_VERSION }}
            VERIFY_BINARY=0
          tags: |
            ${{ env.IMAGE }}:${{ env.OPENCODE_VERSION }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=OpenCode sandbox workload image for the OpenShell runtime

      - name: Record the digest to pin
        shell: bash
        run: |
          set -euo pipefail
          digest='${{ steps.build.outputs.digest }}'
          {
            echo '### OpenCode sandbox image'
            echo
            echo '```'
            echo "${IMAGE}@${digest}"
            echo '```'
            echo
            echo 'Pin this as SANDBOX_IMAGE in .config/k8s/openshell/opencode/create-sandbox.sh.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "image=${IMAGE}@${digest}"
