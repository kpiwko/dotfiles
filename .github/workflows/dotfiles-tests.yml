name: dotfiles tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  affected-binaries:
    name: affected binary tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .config/dotfiles/requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r .config/dotfiles/requirements-test.txt
      - name: Run tests owned by changed binaries
        working-directory: .config/dotfiles
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t binaries < <(
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" \
              | sed -n 's#^\.local/bin/##p' \
              | sort -u
          )
          if (( ${#binaries[@]} == 0 )); then
            echo "No .local/bin executables changed."
            exit 0
          fi
          for binary in "${binaries[@]}"; do
            echo "::group::pytest --binary ${binary}"
            python -m pytest --binary "${binary}"
            echo "::endgroup::"
          done

  full-suite:
    name: full pytest suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .config/dotfiles/requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r .config/dotfiles/requirements-test.txt
      - name: Run tests
        working-directory: .config/dotfiles
        run: python -m pytest
