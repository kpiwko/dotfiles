[project]
name = "dotfiles-tests"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
test = [
  "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "binary(name): test is owned by a .local/bin executable",
  "caddy: caddy configuration/service integration test",
  "k8s: kubernetes manifest test",
]
