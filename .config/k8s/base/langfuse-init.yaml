apiVersion: batch/v1
kind: Job
metadata:
  name: langfuse-init
  namespace: ai-dev
  labels:
    app.kubernetes.io/name: langfuse-init
    app.kubernetes.io/part-of: ai-infrastructure
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: langfuse-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              for target in postgres:5432 clickhouse:8123 redis:6379 minio:9000; do
                host="${target%:*}"
                port="${target#*:}"
                until nc -z "$host" "$port"; do
                  echo "Waiting for $host:$port..."
                  sleep 2
                done
              done
      containers:
        - name: create-event-bucket
          image: minio/mc:latest
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: ai-dev-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-dev-secrets
                  key: MINIO_ROOT_PASSWORD
          command:
            - sh
            - -c
            - |
              mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing local/langfuse-events
              mc stat local/langfuse-events
