apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-worker
  namespace: ai-dev
  labels:
    app.kubernetes.io/name: langfuse-worker
    app.kubernetes.io/part-of: ai-infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-worker
  template:
    metadata:
      labels:
        app: langfuse-worker
    spec:
      initContainers:
        - name: wait-for-langfuse-web
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until wget -q -O /dev/null http://langfuse-web:3000/api/public/health; do
                echo "Waiting for Langfuse web migrations/readiness..."
                sleep 2
              done
      containers:
        - name: langfuse-worker
          image: docker.langfuse.com/langfuse/langfuse-worker:4.30.0
          envFrom:
            - configMapRef:
                name: langfuse-config
            - secretRef:
                name: ai-dev-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1.5Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - "node"
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pgrep
                - -f
                - "node"
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
