# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# Repository-managed, read-only AgentGateway configuration. Provider credentials
# are injected only from the agentgateway-secrets Kubernetes Secret.
config:
  modelCatalog:
    - file: /etc/agentgateway/catalog-overlay.json
  database:
    url: sqlite:///data/agentgateway.db
  storage:
    mode: readOnly
  sensitiveHeaders:
    - authorization
    - x-api-key
frontendPolicies:
  tracing:
    host: otel-collector.ai-dev.svc.cluster.local:4317
    protocol: grpc
    randomSampling: true
    policies:
      requestHeaderModifier:
        set:
          x-mlflow-experiment-id: "$MLFLOW_EXPERIMENT_ID"
gateways:
  default:
    port: 4000
llm:
  gateways: default
  policies:
    apiKey:
      mode: strict
      keys:
        - key: $AGENTGATEWAY_API_KEY
          metadata:
            name: opencode
  models:
    - name: enmaas-opus-5-5
      visibility: internal
      provider: anthropic
      params:
        model: claude-opus-5-5
        apiKey: $ENMAAS_KEY
        baseUrl: $ENMAAS_URL
    - name: enmaas-sonnet-5-5
      visibility: internal
      provider: anthropic
      params:
        model: claude-sonnet-5-5
        apiKey: $ENMAAS_KEY
        baseUrl: $ENMAAS_URL
    - name: enmaas-gpt-6-1-sol
      visibility: internal
      provider:
        custom:
          formats:
            - type: completions
      params:
        model: gpt-6.1-sol
        apiKey: $ENMAAS_KEY
        baseUrl: $ENMAAS_URL
      finalTransformation:
        max_completion_tokens: "llmRequest.max_tokens"
        max_tokens: 'fail("remove")'
        reasoning_effort: '"medium"'
    - name: openai-gpt-5-6-terra
      visibility: internal
      provider: openAI
      params:
        model: gpt-5.6-terra
        apiKey: $OPENAI_API_KEY
    - name: enmaas-gpt-6-luna
      visibility: internal
      provider:
        custom:
          formats:
            - type: completions
      params:
        model: gpt-6-luna
        apiKey: $ENMAAS_KEY
        baseUrl: $ENMAAS_URL
      finalTransformation:
        max_completion_tokens: "llmRequest.max_tokens"
        max_tokens: 'fail("remove")'
        reasoning_effort: '"none"'
    - name: openai-gpt-5-6-luna
      visibility: internal
      provider: openAI
      params:
        model: gpt-5.6-luna
        apiKey: $OPENAI_API_KEY
    - name: enmaas-glm-5-3
      visibility: internal
      provider: anthropic
      params:
        model: rits/zai-org/glm-5-3
        apiKey: $ENMAAS_KEY
        baseUrl: $ENMAAS_URL
    - name: gemini
      visibility: public
      provider: vertex
      params:
        model: gemini-3.8-flash
        vertexProject: $VERTEX_PROJECT
        vertexRegion: $VERTEX_LOCATION
  virtualModels:
    - name: omnipower
      routing:
        failover:
          targets:
            - model: enmaas-opus-5-5
              priority: 0
    - name: architect
      routing:
        failover:
          targets:
            - model: enmaas-gpt-6-1-sol
              priority: 0
            - model: openai-gpt-5-6-terra
              priority: 1
    - name: worker
      routing:
        failover:
          targets:
            - model: enmaas-glm-5-3
              priority: 0
    - name: reviewer
      routing:
        failover:
          targets:
            - model: enmaas-sonnet-5-5
              priority: 0
    - name: spade
      routing:
        failover:
          targets:
            - model: enmaas-gpt-6-luna
              priority: 0
            - model: openai-gpt-5-6-luna
              priority: 1
