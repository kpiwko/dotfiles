apiVersion: apps/v1
kind: Deployment
metadata:
  name: notebooklm-mcp
  namespace: ai-dev
  labels:
    app.kubernetes.io/name: notebooklm-mcp
    app.kubernetes.io/part-of: ai-infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notebooklm-mcp
  template:
    metadata:
      labels:
        app: notebooklm-mcp
    spec:
      enableServiceLinks: false
      containers:
        - name: notebooklm-mcp
          image: ghcr.io/kpiwko/notebooklm-mcp:latest
          ports:
            - containerPort: 17200
              name: http
          env:
            - name: NOTEBOOKLM_MCP_PORT
              value: "17200"
          volumeMounts:
            - name: notebooklm-config
              mountPath: /root/.config/notebooklm-mcp-cli
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 17200
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 17200
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: notebooklm-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: notebooklm-mcp
  namespace: ai-dev
  labels:
    app.kubernetes.io/name: notebooklm-mcp
    app.kubernetes.io/part-of: ai-infrastructure
spec:
  selector:
    app: notebooklm-mcp
  ports:
    - port: 17200
      targetPort: 17200
      nodePort: 17980
      name: http
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-mcp
  namespace: ai-dev
  labels:
    app.kubernetes.io/name: workspace-mcp
    app.kubernetes.io/part-of: ai-infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workspace-mcp
  template:
    metadata:
      labels:
        app: workspace-mcp
    spec:
      enableServiceLinks: false
      containers:
        - name: workspace-mcp
          image: ghcr.io/kpiwko/workspace-mcp:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              value: "8000"
            - name: WORKSPACE_MCP_PORT
              value: "8000"
            - name: GOOGLE_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: workspace-mcp-secrets
                  key: GOOGLE_OAUTH_CLIENT_ID
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: workspace-mcp-secrets
                  key: GOOGLE_OAUTH_CLIENT_SECRET
            - name: GOOGLE_OAUTH_REDIRECT_URI
              value: "http://localhost:17981/oauth2callback"
            - name: OAUTHLIB_INSECURE_TRANSPORT
              value: "1"
          volumeMounts:
            - name: workspace-config
              mountPath: /root/.config/workspace-mcp
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: workspace-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: workspace-mcp
  namespace: ai-dev
  labels:
    app.kubernetes.io/name: workspace-mcp
    app.kubernetes.io/part-of: ai-infrastructure
spec:
  selector:
    app: workspace-mcp
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 17981
      name: http
  type: NodePort
