apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-context7
  namespace: ai-dev
  labels:
    app.kubernetes.io/name: mcp-context7
    app.kubernetes.io/part-of: ai-infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-context7
  template:
    metadata:
      labels:
        app: mcp-context7
    spec:
      containers:
        - name: mcp-context7
          image: mcp/context7:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-secrets
                  key: MCP_CONTEXT7_API_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-context7
  namespace: ai-dev
  labels:
    app.kubernetes.io/name: mcp-context7
    app.kubernetes.io/part-of: ai-infrastructure
spec:
  selector:
    app: mcp-context7
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 17980
      name: http
  type: NodePort
---
