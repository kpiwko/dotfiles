apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentgateway-pvc
  labels:
    app.kubernetes.io/name: agentgateway
    app.kubernetes.io/part-of: ai-infrastructure
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  labels:
    app.kubernetes.io/name: agentgateway
    app.kubernetes.io/part-of: ai-infrastructure
spec:
  # The root Kustomization is the migration-safe maintenance state.
  replicas: 0
  selector:
    matchLabels:
      app: agentgateway
  template:
    metadata:
      labels:
        app: agentgateway
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: agentgateway
          image: cr.agentgateway.dev/agentgateway:v1.6.0
          args:
            - -f
            - /etc/agentgateway/agentgateway.yaml
          env:
            - name: ENMAAS_KEY
              valueFrom:
                secretKeyRef:
                  name: agentgateway-secrets
                  key: ENMAAS_KEY
            - name: ENMAAS_URL
              valueFrom:
                secretKeyRef:
                  name: agentgateway-secrets
                  key: ENMAAS_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentgateway-secrets
                  key: OPENAI_API_KEY
            - name: VERTEX_PROJECT
              valueFrom:
                secretKeyRef:
                  name: agentgateway-secrets
                  key: VERTEX_PROJECT
            - name: VERTEX_LOCATION
              valueFrom:
                secretKeyRef:
                  name: agentgateway-secrets
                  key: VERTEX_LOCATION
            - name: AGENTGATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentgateway-secrets
                  key: AGENTGATEWAY_API_KEY
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/agentgateway/vertex/credentials.json
          ports:
            - name: http
              containerPort: 4000
          volumeMounts:
            - name: config
              mountPath: /etc/agentgateway
              readOnly: true
            - name: data
              mountPath: /data
            - name: vertex-credentials
              mountPath: /var/run/agentgateway/vertex/credentials.json
              subPath: credentials.json
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: agentgateway-config
        - name: data
          persistentVolumeClaim:
            claimName: agentgateway-pvc
        - name: vertex-credentials
          secret:
            secretName: agentgateway-secrets
            items:
              - key: vertex-credentials.json
                path: credentials.json
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  labels:
    app.kubernetes.io/name: agentgateway
    app.kubernetes.io/part-of: ai-infrastructure
spec:
  type: NodePort
  selector:
    app: agentgateway
  ports:
    - name: http
      port: 4000
      targetPort: http
      nodePort: 17904
