apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: ai-dev
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: ai-infrastructure
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
            include_metadata: true

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      transform:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              # Map standard GenAI semantic conventions from OpenCode attributes
              - set(attributes["gen_ai.request.model"], attributes["llm.model_name"]) where attributes["gen_ai.request.model"] == nil and attributes["llm.model_name"] != nil
              - set(attributes["gen_ai.response.model"], attributes["llm.model_name"]) where attributes["gen_ai.response.model"] == nil and attributes["llm.model_name"] != nil
              - set(attributes["gen_ai.usage.input_tokens"], attributes["llm.token_count.prompt"]) where attributes["gen_ai.usage.input_tokens"] == nil and attributes["llm.token_count.prompt"] != nil
              - set(attributes["gen_ai.usage.output_tokens"], attributes["llm.token_count.completion"]) where attributes["gen_ai.usage.output_tokens"] == nil and attributes["llm.token_count.completion"] != nil
              - set(attributes["gen_ai.usage.cost"], attributes["cost_usd"]) where attributes["gen_ai.usage.cost"] == nil and attributes["cost_usd"] != nil

              # Populate MLflow LLM cost attribute on spans where cost_usd is present
              # MLflow UI expects a JSON string with input_cost, output_cost, and total_cost
              - 'set(attributes["mlflow.llm.cost"], Concat(["{\"input_cost\": 0, \"output_cost\": 0, \"total_cost\": ", attributes["cost_usd"], "}"], "")) where attributes["mlflow.llm.cost"] == nil and attributes["cost_usd"] != nil'

              # Handle root agent session span cost
              - 'set(attributes["mlflow.llm.cost"], Concat(["{\"input_cost\": 0, \"output_cost\": 0, \"total_cost\": ", attributes["session.total_cost_usd"], "}"], "")) where attributes["mlflow.llm.cost"] == nil and attributes["session.total_cost_usd"] != nil'
      batch:
        metadata_keys: ["x-mlflow-experiment-id"]

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      headers_setter/mlflow:
        headers:
          - action: upsert
            key: x-mlflow-experiment-id
            from_context: x-mlflow-experiment-id

    exporters:
      otlphttp/mlflow:
        endpoint: http://mlflow:5000
        auth:
          authenticator: headers_setter/mlflow
      debug:
        verbosity: detailed

    service:
      extensions: [health_check, headers_setter/mlflow]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, transform, batch]
          exporters: [otlphttp/mlflow, debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: ai-dev
  labels:
    app: otel-collector
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: ai-infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: ai-infrastructure
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-k8s:0.123.0
          command: ["/otelcol-k8s"]
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - containerPort: 4318
              name: otlp-http
            - containerPort: 13133
              name: healthcheck
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: ai-dev
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: ai-infrastructure
spec:
  type: NodePort
  selector:
    app: otel-collector
  ports:
    - port: 4318
      targetPort: 4318
      nodePort: 17903
      name: otlp-http
    - port: 13133
      targetPort: 13133
      name: healthcheck
