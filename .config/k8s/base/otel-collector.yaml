apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: ai-dev
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: ai-infrastructure
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            include_metadata: true
          http:
            endpoint: 0.0.0.0:4318
            include_metadata: true

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      transform:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              # Map standard GenAI semantic conventions from OpenCode attributes
              - set(attributes["gen_ai.request.model"], attributes["llm.model_name"]) where attributes["gen_ai.request.model"] == nil and attributes["llm.model_name"] != nil
              - set(attributes["gen_ai.response.model"], attributes["llm.model_name"]) where attributes["gen_ai.response.model"] == nil and attributes["llm.model_name"] != nil
              - set(attributes["gen_ai.usage.input_tokens"], attributes["llm.token_count.prompt"]) where attributes["gen_ai.usage.input_tokens"] == nil and attributes["llm.token_count.prompt"] != nil
              - set(attributes["gen_ai.usage.output_tokens"], attributes["llm.token_count.completion"]) where attributes["gen_ai.usage.output_tokens"] == nil and attributes["llm.token_count.completion"] != nil
              - set(attributes["gen_ai.usage.cost"], attributes["agw.ai.usage.cost.total"]) where attributes["gen_ai.usage.cost"] == nil and attributes["agw.ai.usage.cost.total"] != nil
              - set(attributes["gen_ai.usage.cost"], attributes["cost_usd"]) where attributes["gen_ai.usage.cost"] == nil and attributes["cost_usd"] != nil
              - set(attributes["agw.ai.usage.cost.total"], attributes["gen_ai.usage.cost"]) where attributes["agw.ai.usage.cost.total"] == nil and attributes["gen_ai.usage.cost"] != nil and attributes["gen_ai.usage.cost"] != 0 and attributes["gen_ai.usage.cost"] != "0"

              # AgentGateway's native spans carry realized cost after a catalog match.
              # Do not create a cost value when its input/output breakdown is absent.
              - 'set(attributes["mlflow.llm.cost"], Concat(["{\"input_cost\": ", attributes["agw.ai.usage.cost.input"], ", \"output_cost\": ", attributes["agw.ai.usage.cost.output"], ", \"total_cost\": ", attributes["agw.ai.usage.cost.total"], "}"], "")) where attributes["mlflow.llm.cost"] == nil and attributes["agw.ai.usage.cost.input"] != nil and attributes["agw.ai.usage.cost.output"] != nil and attributes["agw.ai.usage.cost.total"] != nil'

              # Preserve compatibility with existing OpenCode-originated cost fields.
              # MLflow UI expects a JSON string with input_cost, output_cost, and total_cost
              - 'set(attributes["mlflow.llm.cost"], Concat(["{\"input_cost\": 0, \"output_cost\": 0, \"total_cost\": ", attributes["cost_usd"], "}"], "")) where attributes["mlflow.llm.cost"] == nil and attributes["cost_usd"] != nil and attributes["cost_usd"] != 0 and attributes["cost_usd"] != "0"'

              # Handle root agent session span cost
              - 'set(attributes["mlflow.llm.cost"], Concat(["{\"input_cost\": 0, \"output_cost\": 0, \"total_cost\": ", attributes["session.total_cost_usd"], "}"], "")) where attributes["mlflow.llm.cost"] == nil and attributes["session.total_cost_usd"] != nil and attributes["session.total_cost_usd"] != 0 and attributes["session.total_cost_usd"] != "0"'

              # MLflow 3.17.0 SQL span-type indexing workaround. In MLflow 3.17.0,
              # SqlAlchemyStore writes the SQL spans.type column from the inbound
              # canonical mlflow.spanType only, while openinference.span.kind is
              # translated into stored display attributes. OpenInference-only spans
              # therefore get a NULL SQL type and drop out of grouped span_type
              # metrics even though the UI displays their translated kind. Copy the
              # canonical attribute from the OpenInference kind using exactly the
              # upstream OpenInferenceTranslator.SPAN_KIND_TO_MLFLOW_TYPE allowlist
              # (mlflow/tracing/otel/translation/open_inference.py, v3.17.0), and
              # only when the canonical attribute is absent: never overwrite an
              # existing canonical value, and leave missing/unknown kinds unmapped
              # rather than synthesizing UNKNOWN. Remove this block when a fixed
              # upstream MLflow release derives the SQL type from translated
              # attributes.
              - set(attributes["mlflow.spanType"], "TOOL") where attributes["mlflow.spanType"] == nil and attributes["openinference.span.kind"] == "TOOL"
              - set(attributes["mlflow.spanType"], "CHAIN") where attributes["mlflow.spanType"] == nil and attributes["openinference.span.kind"] == "CHAIN"
              - set(attributes["mlflow.spanType"], "LLM") where attributes["mlflow.spanType"] == nil and attributes["openinference.span.kind"] == "LLM"
              - set(attributes["mlflow.spanType"], "RETRIEVER") where attributes["mlflow.spanType"] == nil and attributes["openinference.span.kind"] == "RETRIEVER"
              - set(attributes["mlflow.spanType"], "EMBEDDING") where attributes["mlflow.spanType"] == nil and attributes["openinference.span.kind"] == "EMBEDDING"
              - set(attributes["mlflow.spanType"], "AGENT") where attributes["mlflow.spanType"] == nil and attributes["openinference.span.kind"] == "AGENT"
              - set(attributes["mlflow.spanType"], "RERANKER") where attributes["mlflow.spanType"] == nil and attributes["openinference.span.kind"] == "RERANKER"
              - set(attributes["mlflow.spanType"], "UNKNOWN") where attributes["mlflow.spanType"] == nil and attributes["openinference.span.kind"] == "UNKNOWN"
              - set(attributes["mlflow.spanType"], "GUARDRAIL") where attributes["mlflow.spanType"] == nil and attributes["openinference.span.kind"] == "GUARDRAIL"
              - set(attributes["mlflow.spanType"], "EVALUATOR") where attributes["mlflow.spanType"] == nil and attributes["openinference.span.kind"] == "EVALUATOR"
      batch:
        metadata_keys: ["x-mlflow-experiment-id"]

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      headers_setter/mlflow:
        headers:
          - action: upsert
            key: x-mlflow-experiment-id
            from_context: x-mlflow-experiment-id

    exporters:
      otlphttp/mlflow:
        endpoint: http://mlflow:5000
        auth:
          authenticator: headers_setter/mlflow
      debug:
        verbosity: detailed

    service:
      extensions: [health_check, headers_setter/mlflow]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, transform, batch]
          exporters: [otlphttp/mlflow, debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: ai-dev
  labels:
    app: otel-collector
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: ai-infrastructure
spec:
  # Stop this MLflow database writer until the runtime overlay is applied.
  replicas: 0
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: ai-infrastructure
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-k8s:0.123.0
          command: ["/otelcol-k8s"]
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - containerPort: 4318
              name: otlp-http
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 13133
              name: healthcheck
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: ai-dev
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: ai-infrastructure
spec:
  type: NodePort
  selector:
    app: otel-collector
  ports:
    - port: 4317
      targetPort: 4317
      name: otlp-grpc
    - port: 4318
      targetPort: 4318
      nodePort: 17903
      name: otlp-http
    - port: 13133
      targetPort: 13133
      name: healthcheck
