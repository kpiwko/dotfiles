apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-config
  namespace: ai-dev
  labels:
    app.kubernetes.io/name: langfuse
    app.kubernetes.io/part-of: ai-infrastructure
data:
  NEXTAUTH_URL: "http://localhost:3000"
  NEXTAUTH_SECRET: "devsecretkey_0123456789abcdef0123456789abcdef"
  NEXT_PUBLIC_AUDIT_LOGS_ENABLED: "true"
  DATABASE_URL: "postgresql://langfuse:postgresdevpass123@postgres:5432/langfuse"
  TELEMETRY_ENABLED: "false"
  LANGFUSE_CLOUD_REGION: "self-hosted"
  CLICKHOUSE_URL: "http://clickhouse:8123"
  CLICKHOUSE_USER: "langfuse"
  CLICKHOUSE_PASSWORD: "clickhousedevpass123"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "redisdevpass123"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_ACCESS_KEY: "langfuse"
  MINIO_SECRET_KEY: "miniodevpass123"
