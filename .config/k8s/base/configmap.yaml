  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "redisdevpass123"
  REDIS_AUTH: "redisdevpass123"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_ACCESS_KEY: "langfuse"
  MINIO_SECRET_KEY: "miniodevpass123"
  LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "true"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "langfuse-events"
  LANGFUSE_S3_EVENT_UPLOAD_REGION: "us-east-1"
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "http://minio:9000"
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: "langfuse"
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "miniodevpass123"
