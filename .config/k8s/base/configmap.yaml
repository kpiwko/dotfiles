apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-config
  namespace: ai-dev
  labels:
    app.kubernetes.io/name: langfuse
    app.kubernetes.io/part-of: ai-infrastructure
data:
  NEXTAUTH_URL: "http://localhost:3000"
  NEXTAUTH_SECRET: "${LANGFUSE_SECRET_KEY}"
  NEXT_PUBLIC_AUDIT_LOGS_ENABLED: "true"
  DATABASE_URL: "postgresql://langfuse:${POSTGRES_PASSWORD}@postgres:5432/langfuse"
  TELEMETRY_ENABLED: "false"
  LANGFUSE_CLOUD_REGION: "self-hosted"
  CLICKHOUSE_URL: "http://clickhouse:8123"
  CLICKHOUSE_USER: "langfuse"
  CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_ACCESS_KEY: "langfuse"
  MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
