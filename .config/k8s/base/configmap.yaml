apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-config
  namespace: ai-dev
  labels:
    app.kubernetes.io/name: langfuse
    app.kubernetes.io/part-of: ai-infrastructure
data:
  NEXTAUTH_URL: "http://localhost:17900"
  NEXTAUTH_SECRET: "devsecretkey_0123456789abcdef0123456789abcdef"
  SALT: "devsaltkey_0123456789abcdef0123456789abcdef"
  ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  NEXT_PUBLIC_AUDIT_LOGS_ENABLED: "true"
  DATABASE_URL: "postgresql://langfuse:postgresdevpass123@postgres:5432/langfuse"
  TELEMETRY_ENABLED: "false"
  LANGFUSE_CLOUD_REGION: "self-hosted"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
  CLICKHOUSE_URL: "http://clickhouse:8123"
  CLICKHOUSE_MIGRATION_URL: "clickhouse://langfuse:clickhousedevpass123@clickhouse:9000/default"
  CLICKHOUSE_USER: "langfuse"
  CLICKHOUSE_PASSWORD: "clickhousedevpass123"
  CLICKHOUSE_DB: "default"
