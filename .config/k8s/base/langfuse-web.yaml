apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web
  namespace: ai-dev
  labels:
    app.kubernetes.io/name: langfuse-web
    app.kubernetes.io/part-of: ai-infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-web
  template:
    metadata:
      labels:
        app: langfuse-web
    spec:
      containers:
        - name: langfuse-web
          image: langfuse/langfuse:3
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: langfuse-config
            - secretRef:
                name: ai-dev-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1.5Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-web
  namespace: ai-dev
  labels:
    app.kubernetes.io/name: langfuse-web
    app.kubernetes.io/part-of: ai-infrastructure
spec:
  selector:
    app: langfuse-web
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 17900
      name: http
  type: NodePort
