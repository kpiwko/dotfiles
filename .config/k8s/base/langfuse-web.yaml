apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web
  namespace: ai-dev
  labels:
    app.kubernetes.io/name: langfuse-web
    app.kubernetes.io/part-of: ai-infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-web
  template:
    metadata:
      labels:
        app: langfuse-web
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              for target in postgres:5432 clickhouse:8123 redis:6379 minio:9000; do
                host="${target%:*}"
                port="${target#*:}"
                until nc -z "$host" "$port"; do
                  echo "Waiting for $host:$port..."
                  sleep 2
                done
              done
        - name: wait-for-event-bucket
          image: minio/mc:latest
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: ai-dev-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-dev-secrets
                  key: MINIO_ROOT_PASSWORD
          command:
            - sh
            - -c
            - |
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && \
                    mc stat local/langfuse-events >/dev/null 2>&1; do
                echo "Waiting for langfuse-events bucket..."
                sleep 2
              done
      containers:
        - name: langfuse-web
          image: docker.langfuse.com/langfuse/langfuse:4.30.0
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: langfuse-config
            - secretRef:
                name: ai-dev-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1.5Gi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-web
  namespace: ai-dev
  labels:
    app.kubernetes.io/name: langfuse-web
    app.kubernetes.io/part-of: ai-infrastructure
spec:
  selector:
    app: langfuse-web
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 17900
      name: http
  type: NodePort
