# Declarative MLflow AI Gateway routing for the cloud OpenCode agents.
#
# Values are deliberately environment-backed. Never replace env_var entries
# with credentials in this file. The reconciler owns only the endpoint names
# listed below and must leave all other MLflow resources untouched.
schema_version: "1"

gateway:
  url: "${MLFLOW_GATEWAY_BASE_URL:-https://mlflow.fous.ai}"
  inference_url: "${MLFLOW_GATEWAY_BASE_URL:-https://mlflow.fous.ai}/gateway/mlflow/v1"
  managed_endpoints:
    - orchestrator
    - architect
    - plan
    - implement
    - review
    - zweistein

secrets:
  - name: enmaas-api-key
    env_var: ENMAAS_KEY
  - name: openai-api-key
    env_var: OPENAI_API_KEY
  - name: mlflow-gateway-api-key
    env_var: MLFLOW_GATEWAY_API_KEY
  # Vertex uses Application Default Credentials. This is a local path, not a
  # credential value, and is resolved by the gateway deployment environment.
  - name: vertex-credentials
    env_var: GOOGLE_APPLICATION_CREDENTIALS

models:
  - name: enmaas-gemini-3.8-flash
    provider: enmaas
    upstream_model: gemini-3.8-flash
    base_url_env_var: ENMAAS_URL
    secret_ref: enmaas-api-key
  - name: vertex-gemini-3.8-flash
    provider: vertex
    upstream_model: gemini-3.8-flash
    project_env_var: VERTEX_PROJECT
    location_env_var: VERTEX_LOCATION
    secret_ref: vertex-credentials
  - name: openai-gpt-5.6-luna
    provider: openai
    upstream_model: gpt-5.6-luna
    secret_ref: openai-api-key
  - name: openai-gpt-5.6-terra
    provider: openai
    upstream_model: gpt-5.6-terra
    secret_ref: openai-api-key

# MLflow endpoint names intentionally match the OpenCode model suffixes:
# OpenCode's mlflow/<name> therefore routes directly to <name> here.
#
# EnMaaS does not provide gpt-5.6-luna or gpt-5.6-terra. implement, review,
# and zweistein consequently retain their original OpenAI provider as PRIMARY
# and use Vertex as FALLBACK; this is an intentional provider exception.
endpoints:
  orchestrator:
    model_configs:
      - model_definition: enmaas-gemini-3.8-flash
        linkage_type: PRIMARY
        fallback_order: 0
        weight: 1
      - model_definition: vertex-gemini-3.8-flash
        linkage_type: FALLBACK
        fallback_order: 1
        weight: 1
    fallback_config:
      strategy: SEQUENTIAL
  architect:
    model_configs:
      - model_definition: enmaas-gemini-3.8-flash
        linkage_type: PRIMARY
        fallback_order: 0
        weight: 1
      - model_definition: vertex-gemini-3.8-flash
        linkage_type: FALLBACK
        fallback_order: 1
        weight: 1
    fallback_config:
      strategy: SEQUENTIAL
  plan:
    model_configs:
      - model_definition: enmaas-gemini-3.8-flash
        linkage_type: PRIMARY
        fallback_order: 0
        weight: 1
      - model_definition: vertex-gemini-3.8-flash
        linkage_type: FALLBACK
        fallback_order: 1
        weight: 1
    fallback_config:
      strategy: SEQUENTIAL
  implement:
    model_configs:
      - model_definition: openai-gpt-5.6-luna
        linkage_type: PRIMARY
        fallback_order: 0
        weight: 1
      - model_definition: vertex-gemini-3.8-flash
        linkage_type: FALLBACK
        fallback_order: 1
        weight: 1
    fallback_config:
      strategy: SEQUENTIAL
  review:
    model_configs:
      - model_definition: openai-gpt-5.6-luna
        linkage_type: PRIMARY
        fallback_order: 0
        weight: 1
      - model_definition: vertex-gemini-3.8-flash
        linkage_type: FALLBACK
        fallback_order: 1
        weight: 1
    fallback_config:
      strategy: SEQUENTIAL
  zweistein:
    model_configs:
      - model_definition: openai-gpt-5.6-terra
        linkage_type: PRIMARY
        fallback_order: 0
        weight: 1
      - model_definition: vertex-gemini-3.8-flash
        linkage_type: FALLBACK
        fallback_order: 1
        weight: 1
    fallback_config:
      strategy: SEQUENTIAL

# implement-local (omlx/Qwen3-Coder-Next-6bit) and implement-maas
# (litemaas/Qwen3.8-27B-NT) are intentionally excluded: they are local or
# LiteMaaS routes and must remain outside this cloud gateway declaration.
